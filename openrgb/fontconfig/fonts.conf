<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig used only by OpenRGB (see bin/openrgb-run). The stock fontconfig rules made
     OpenRGB's Qt GUI segfault inside libfontconfig on the original machine; this file avoids that.
     Safe to delete if OpenRGB runs fine without it. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">openrgb-fontconfig</cachedir>
</fontconfig>
